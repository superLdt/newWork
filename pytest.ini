[pytest]
# 测试文件匹配模式
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 添加项目根目录到Python路径
addopts = --tb=short -v

# 覆盖率配置
# addopts = --cov=app --cov-report=html --cov-report=term-missing

# 测试发现选项
norecursedirs = .git .venv env venv build dist *.egg-info

# 日志配置
log_cli = true
log_cli_level = INFO

# 测试超时设置
timeout = 30

# 并行测试设置
# xdist = true
# numprocesses = auto